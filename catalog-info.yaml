apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: code-squad-pam
  title: Pam - Frontend Engineer
  description: Senior React engineer that answers design questions or implements a task in a sandbox and opens a merge request.
  tags: [ai-agent, codegen, react, frontend]
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: acarmisc/the-office-ai-squad
    ai-agent.io/runtime: http
    ai-agent.io/runtime-handle: code-squad-pam
    ai-agent.io/endpoint: http://code-squad-pam.code-squad.svc.cluster.local:8080
    ai-agent.io/health: http://code-squad-pam.code-squad.svc.cluster.local:8080/ping
    ai-agent.io/telemetry-id: code-squad-pam
    ai-agent.io/squad: code-squad
    ai-agent.io/version: '0.1.0'
    ai-agent.io/purpose: In advisor mode proposes patterns and plans; in implementer mode clones the repository in an isolated sandbox, implements the task, runs the project checks and opens a merge request when posting is allowed.
    ai-agent.io/capabilities: 'codegen:tools,react:reasoning,sandboxed-execution:tools,project-skills:tools'
    ai-agent.io/billing-model: per-token
    ai-agent.io/hire-schema: >-
      [{"name":"project","label":"Project","type":"text","required":true,"help":"Repository path, e.g. group/repo (GitLab) or owner/repo (GitHub)"},
       {"name":"mode","label":"Mode","type":"select","required":true,"options":["advisor","implementer"],"default":"advisor","help":"advisor = read-only answer or plan; implementer = write code in a sandbox"},
       {"name":"target","label":"Issue","type":"text","help":"Optional issue number or key the task comes from"},
       {"name":"task","label":"Task","type":"textarea","required":true,"help":"What to build or which question to answer; include acceptance criteria"},
       {"name":"action","label":"Action","type":"select","required":true,"options":["dry-run","post"],"default":"dry-run","help":"dry-run = implement in the sandbox and show the diff only; post = push the branch and open the merge request"}]
    ai-agent.io/prompt-template: "Mode: {mode}. Project '{project}', issue {target}. Task: {task}. Action: {action}."
spec:
  type: ai-agent
  lifecycle: experimental
  owner: group:default/platform-team
  system: code-squad
  providesApis:
    - code-squad-pam-api
---
