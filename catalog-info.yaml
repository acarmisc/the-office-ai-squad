# Backstage catalog for Code Squad.
# Owner: the owner is configurable. Replace group:default/platform-team with the owning group
# before registering this file. Every entity uses the same owner so the catalog stays simple.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: code-squad
  title: Code Squad
  description: "Specialised review and engineering agents, portable to any Kubernetes cluster."
  tags: [agents, code-review, llm]
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:default/platform-team
  domain: developer-tools
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: code-squad-michael
  title: Michael - Orchestrator
  description: Routes change requests, incidents and tasks to the squad specialists and publishes one consolidated verdict.
  tags: [ai-agent, orchestrator, code-review]
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: acarmisc/the-office-ai-squad
    ai-agent.io/runtime: http
    ai-agent.io/runtime-handle: code-squad-michael
    ai-agent.io/endpoint: http://code-squad-michael.code-squad.svc.cluster.local:8080
    ai-agent.io/health: http://code-squad-michael.code-squad.svc.cluster.local:8080/ping
    ai-agent.io/telemetry-id: code-squad-michael
    ai-agent.io/squad: code-squad
    ai-agent.io/version: '0.1.0'
    ai-agent.io/purpose: Detects the stack and intent of a change request, runs the right specialists in parallel, deduplicates their findings and posts a single verdict.
    ai-agent.io/capabilities: 'routing:reasoning,aggregation:reasoning,tool-use:tools'
    ai-agent.io/billing-model: per-token
    ai-agent.io/hire-schema: >-
      [{"name":"project","label":"Project","type":"text","required":true,"help":"Repository path, e.g. group/repo (GitLab) or owner/repo (GitHub)"},
       {"name":"mode","label":"Request type","type":"select","required":true,"options":["review","troubleshoot","implementer","question"],"default":"review","help":"review = full squad review of a change request; troubleshoot = incident investigation by darryl; implementer = pam implements an issue; question = ask the squad"},
       {"name":"target","label":"Target","type":"text","required":true,"help":"Merge/pull request number, issue number, or an incident reference"},
       {"name":"action","label":"Action","type":"select","required":true,"options":["dry-run","post"],"default":"dry-run","help":"dry-run = show the result only; post = publish comments, status and any change request"}]
    ai-agent.io/prompt-template: "Handle a '{mode}' request on project '{project}', target {target}. Action: {action}."
spec:
  type: ai-agent
  lifecycle: experimental
  owner: group:default/platform-team
  system: code-squad
  dependsOn:
    - component:default/code-squad-jim
    - component:default/code-squad-angela
    - component:default/code-squad-dwight
    - component:default/code-squad-darryl
    - component:default/code-squad-pam
  providesApis:
    - code-squad-michael-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: code-squad-michael-api
  title: Code Squad michael API
  description: "HTTP contract of the michael agent (probes, metrics and invocations; webhooks)."
  tags: [agents, openapi, michael]
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/platform-team
  system: code-squad
  definition: |
    openapi: 3.0.3
    info:
      title: code-squad michael API
      version: 0.1.0
      description: HTTP contract of the michael agent. See the documentation for the request and result schema.
    servers:
      - url: http://code-squad-michael.code-squad.svc:8080
    paths:
      /ping:
        get:
          summary: Liveness probe
          operationId: michaelPing
          responses:
            '200':
              description: Process is alive
      /ready:
        get:
          summary: Readiness probe. 503 when the agent specification did not load.
          operationId: michaelReady
          responses:
            '200':
              description: Agent loaded
            '503':
              description: Agent not loaded
      /metrics:
        get:
          summary: Prometheus metrics
          operationId: michaelMetrics
          responses:
            '200':
              description: Prometheus text exposition
      /invocations:
        post:
          summary: Run the agent synchronously, or asynchronously with Prefer respond-async
          operationId: michaelInvoke
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [prompt]
                  additionalProperties: false
                  properties:
                    prompt:
                      type: string
                    project:
                      type: string
                    target:
                      type: string
                    mode:
                      type: string
                    post:
                      type: boolean
          responses:
            '200':
              description: Invocation result
            '202':
              description: Accepted for asynchronous processing (Prefer respond-async)
            '422':
              description: Request failed validation
      /webhooks/gitlab:
        post:
          summary: GitLab webhook receiver (X-Gitlab-Token)
          operationId: michaelWebhookGitlab
          responses:
            '202':
              description: Accepted or ignored
            '200':
              description: Duplicate delivery
            '401':
              description: Invalid token
      /webhooks/github:
        post:
          summary: GitHub webhook receiver (X-Hub-Signature-256)
          operationId: michaelWebhookGithub
          responses:
            '202':
              description: Accepted or ignored
            '200':
              description: Duplicate delivery
            '401':
              description: Invalid signature
