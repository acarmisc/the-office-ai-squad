# Backstage catalog for Code Squad.
# Owner: the owner is configurable. Replace group:default/platform-team with the owning group
# before registering this file. Every entity uses the same owner so the catalog stays simple.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: code-squad
  title: Code Squad
  description: "Specialised review and engineering agents, portable to any Kubernetes cluster."
  tags: [agents, code-review, llm]
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:default/platform-team
  domain: developer-tools
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: code-squad-michael
  title: Code Squad michael
  description: "Orchestrator: receives webhooks, routes requests, fans out to specialists and publishes one consolidated review."
  tags: [agents, code-squad, michael]
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: acarmisc/the-office-ai-squad
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-team
  system: code-squad
  providesApis:
    - code-squad-michael-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: code-squad-michael-api
  title: Code Squad michael API
  description: "HTTP contract of the michael agent (probes, metrics and invocations; webhooks)."
  tags: [agents, openapi, michael]
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/platform-team
  system: code-squad
  definition: |
    openapi: 3.0.3
    info:
      title: code-squad michael API
      version: 0.1.0
      description: HTTP contract of the michael agent. See the documentation for the request and result schema.
    servers:
      - url: http://code-squad-michael.code-squad.svc:8080
    paths:
      /ping:
        get:
          summary: Liveness probe
          operationId: michaelPing
          responses:
            '200':
              description: Process is alive
      /ready:
        get:
          summary: Readiness probe. 503 when the agent specification did not load.
          operationId: michaelReady
          responses:
            '200':
              description: Agent loaded
            '503':
              description: Agent not loaded
      /metrics:
        get:
          summary: Prometheus metrics
          operationId: michaelMetrics
          responses:
            '200':
              description: Prometheus text exposition
      /invocations:
        post:
          summary: Run the agent synchronously, or asynchronously with Prefer respond-async
          operationId: michaelInvoke
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [prompt]
                  additionalProperties: false
                  properties:
                    prompt:
                      type: string
                    project:
                      type: string
                    target:
                      type: string
                    mode:
                      type: string
                    post:
                      type: boolean
          responses:
            '200':
              description: Invocation result
            '202':
              description: Accepted for asynchronous processing (Prefer respond-async)
            '422':
              description: Request failed validation
      /webhooks/gitlab:
        post:
          summary: GitLab webhook receiver (X-Gitlab-Token)
          operationId: michaelWebhookGitlab
          responses:
            '202':
              description: Accepted or ignored
            '200':
              description: Duplicate delivery
            '401':
              description: Invalid token
      /webhooks/github:
        post:
          summary: GitHub webhook receiver (X-Hub-Signature-256)
          operationId: michaelWebhookGithub
          responses:
            '202':
              description: Accepted or ignored
            '200':
              description: Duplicate delivery
            '401':
              description: Invalid signature
---
