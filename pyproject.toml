[project]
name = "code-squad"
version = "0.1.0"
description = "Specialised review and engineering agents (Kubernetes-portable)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "strands-agents[openai]>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "kubernetes>=31.0",
    "typer>=0.12",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
s3 = ["boto3>=1.34"]

[project.scripts]
squad = "code_squad._common.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "jsonschema>=4.23",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_squad"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["eval/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
exclude = ["eval/fixtures/"]

[[tool.mypy.overrides]]
module = ["kubernetes.*", "strands.*", "boto3.*", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
