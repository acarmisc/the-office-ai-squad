name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: uv sync --frozen
      - name: lint
        run: just lint
      - name: typecheck
        run: just typecheck
      - name: test
        run: just test
      - name: docs
        run: just prompts docs-check docs
      - name: chart-lint
        run: just helm-lint secret-scan

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f deploy/Dockerfile -t code-squad:${GITHUB_SHA::8} .

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Deploy (manual)
        run: echo "helm upgrade --install code-squad deploy/helm/code-squad -f <your values>"
