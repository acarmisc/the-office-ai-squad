# External Secrets Operator sample. Syncs the keys of secret-plain.yaml from a secret store into
# Secret code-squad-secrets, which the chart references through secrets.existingSecret.
# The store below is a placeholder Vault configuration. Replace it with your provider.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: code-squad-store
  namespace: code-squad
spec:
  provider:
    vault:
      server: https://vault.example.internal:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: code-squad
          serviceAccountRef:
            name: external-secrets-reader
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: code-squad-secrets
  namespace: code-squad
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: code-squad-store
    kind: SecretStore
  target:
    # Must equal secrets.existingSecret in values.
    name: code-squad-secrets
    creationPolicy: Owner
  data:
    - secretKey: llm-api-key
      remoteRef:
        key: code-squad/llm
        property: api-key
    - secretKey: gitlab-token
      remoteRef:
        key: code-squad/gitlab
        property: token
    - secretKey: github-app-private-key
      remoteRef:
        key: code-squad/github-app
        property: private-key
    - secretKey: github-app-id
      remoteRef:
        key: code-squad/github-app
        property: app-id
    - secretKey: github-webhook-secret
      remoteRef:
        key: code-squad/github
        property: webhook-secret
    - secretKey: gitlab-webhook-secret
      remoteRef:
        key: code-squad/gitlab
        property: webhook-secret
    - secretKey: nvd-api-key
      remoteRef:
        key: code-squad/nvd
        property: api-key
