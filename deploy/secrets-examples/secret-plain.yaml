# Plain Secret manifest for local or GitOps-encrypted workflows. Every value is a placeholder.
# Never commit real values. Create the real Secret with your own tooling, for example:
#   kubectl -n code-squad create secret generic code-squad-secrets --from-file=... --dry-run=client -o yaml
# Each key becomes one file under SECRETS_DIR (/var/run/secrets/squad) inside the pods.
apiVersion: v1
kind: Secret
metadata:
  name: code-squad-secrets
  namespace: code-squad
  labels:
    app.kubernetes.io/part-of: code-squad
type: Opaque
stringData:
  # LLM gateway key. Also exposed as LLM_API_KEY through the chart's llm.apiKeySecret.
  llm-api-key: REPLACE_ME
  # GitLab project or group access token (VCS_TOKEN fallback, or per-project token_secret).
  gitlab-token: REPLACE_ME
  # GitHub App private key, PEM text. Keep the BEGIN and END lines.
  github-app-private-key: |
    REPLACE_ME_WITH_THE_FULL_PEM_BLOCK_INCLUDING_BEGIN_AND_END_LINES
  # GitHub App numeric id.
  github-app-id: "REPLACE_ME"
  # Secret used to verify X-Hub-Signature-256 on GitHub webhooks.
  github-webhook-secret: REPLACE_ME
  # Secret used to verify X-Gitlab-Token on GitLab webhooks.
  gitlab-webhook-secret: REPLACE_ME
  # NVD API key (optional, dwight). Without it dwight uses the rate-limited anonymous quota.
  nvd-api-key: REPLACE_ME
