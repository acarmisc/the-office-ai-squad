# Local demo: the six agents plus an offline fake LLM, all from the code-squad:dev image.
#
#   docker compose -f deploy/compose.yaml up -d --build
#   scripts/smoke_test.sh compose
#   docker compose -f deploy/compose.yaml down
#
# Agents are reachable on the host at http://127.0.0.1:8081 (michael) through 8086 (pam).
# Each container runs read-only, as uid 10001, with no capabilities and no-new-privileges.
#
# PYTHON_IMAGE selects the base image. Behind a TLS-intercepting proxy, build a base that
# trusts the proxy CA first: scripts/local_ca_base.sh (local verification only).
name: code-squad

x-agent: &agent
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
  image: code-squad:dev
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-agent-env: &agent-env
  LLM_BASE_URL: http://fake-llm:4000
  LLM_API_KEY: fake-key-for-local-demo

services:
  fake-llm:
    <<: *agent
    # The image ENTRYPOINT runs uvicorn for an agent, so replace it (keeping tini as PID 1).
    entrypoint: ["tini", "--", "python", "-m", "deploy.fake_llm"]
    command: []
    # Listens on port 4000 inside the compose network; not published to the host.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  michael:
    <<: *agent
    depends_on:
      fake-llm:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      <<: *agent-env
      AGENT_NAME: michael
      ORCHESTRATOR_SPECIALIST_URLS: "jim=http://jim:8080,angela=http://angela:8080,dwight=http://dwight:8080,darryl=http://darryl:8080,pam=http://pam:8080"

  jim:
    <<: *agent
    depends_on:
      fake-llm:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      <<: *agent-env
      AGENT_NAME: jim

  angela:
    <<: *agent
    depends_on:
      fake-llm:
        condition: service_healthy
    ports:
      - "8083:8080"
    environment:
      <<: *agent-env
      AGENT_NAME: angela

  dwight:
    <<: *agent
    depends_on:
      fake-llm:
        condition: service_healthy
    ports:
      - "8084:8080"
    environment:
      <<: *agent-env
      AGENT_NAME: dwight

  darryl:
    <<: *agent
    depends_on:
      fake-llm:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      <<: *agent-env
      AGENT_NAME: darryl

  pam:
    <<: *agent
    depends_on:
      fake-llm:
        condition: service_healthy
    ports:
      - "8086:8080"
    environment:
      <<: *agent-env
      AGENT_NAME: pam
