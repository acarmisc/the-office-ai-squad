# yaml-language-server: $schema=../values.schema.json
#
# Secrets come from External Secrets Operator. The ExternalSecret (see
# deploy/secrets-examples/external-secret.yaml) creates Secret code-squad-secrets with the same
# keys as secret-plain.yaml. The chart only references it. No secret value is in this file.

image:
  # Your registry path for the code-squad image.
  repository: registry.example.com/platform/code-squad
  # Pinned tag.
  tag: "0.1.0"

llm:
  # Internal LLM gateway.
  baseUrl: https://llm-gateway.example.internal/v1
  apiKeySecret:
    # Empty: take the key from secrets.existingSecret (the ExternalSecret target).
    name: ""
    # Key in the synced Secret.
    key: llm-api-key

vcs:
  # Pin the provider.
  provider: gitlab
  # Self-managed GitLab.
  baseUrl: https://gitlab.example.com

secrets:
  # Target Secret name of the ExternalSecret. Must match metadata.name there.
  existingSecret: code-squad-secrets

webhooks:
  gitlab:
    # Route /webhooks/gitlab.
    enabled: true
  github:
    # No GitHub here.
    enabled: false
  # Empty: webhook secrets live in the same synced Secret.
  secretName: ""

networkPolicy:
  # Policies on.
  enabled: true
  # Internal LLM gateway.
  llmGatewayCIDRs: ["192.0.2.0/24"]
  # GitLab address range.
  vcsCIDRs: ["198.51.100.10/32"]
  # Kube-apiserver endpoint IPs for darryl and pam.
  kubeAPIServerCIDRs: ["203.0.113.5/32"]

devops:
  # darryl reads the listed namespaces.
  allowedNamespaces: ["payments"]
  # Keep cluster-wide read off.
  clusterWide: false

sandbox:
  # Sandbox on.
  enabled: true
  # Namespace name.
  namespace: code-squad-sandbox
  # Sandbox image.
  image: registry.example.com/platform/code-squad-sandbox-node:0.1.0
  # GitLab host only, on HTTPS.
  allowedEgressCIDRs: ["198.51.100.10/32"]
