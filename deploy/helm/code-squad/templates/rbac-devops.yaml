{{- /*
darryl (devops reviewer): read-only access to workloads, events, logs and pod metrics.
Secrets are never granted. Either one Role per allowed namespace, or one ClusterRole.
*/ -}}
{{- $root := . -}}
{{- $darrylCtx := dict "id" "darryl" "root" $root -}}
{{- if (index .Values.agents "darryl").enabled }}
{{- if .Values.devops.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: code-squad-devops-read
  labels:
    {{- include "code-squad.labels" $root | nindent 4 }}
rules:
  {{- include "code-squad.devopsReadRules" $root | nindent 2 }}
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-squad-darryl-devops-read
  labels:
    {{- include "code-squad.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: code-squad-devops-read
subjects:
  - kind: ServiceAccount
    name: {{ include "code-squad.serviceAccountName" $darrylCtx }}
    namespace: {{ include "code-squad.namespace" $root }}
{{- else }}
{{- range $targetNs := .Values.devops.allowedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: code-squad-devops-read
  namespace: {{ $targetNs | quote }}
  labels:
    {{- include "code-squad.labels" $root | nindent 4 }}
rules:
  {{- include "code-squad.devopsReadRules" $root | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: code-squad-darryl-devops-read
  namespace: {{ $targetNs | quote }}
  labels:
    {{- include "code-squad.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: code-squad-devops-read
subjects:
  - kind: ServiceAccount
    name: {{ include "code-squad.serviceAccountName" $darrylCtx }}
    namespace: {{ include "code-squad.namespace" $root }}
{{- end }}
{{- end }}
{{- end }}
