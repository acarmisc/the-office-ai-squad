{{- $root := . -}}
{{- if .Values.serviceAccount.create }}
{{- range $id := splitList " " (include "code-squad.agentIds" .) }}
{{- if (index $root.Values.agents $id).enabled }}
{{- $dctx := dict "id" $id "root" $root }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "code-squad.agentName" $dctx }}
  namespace: {{ include "code-squad.namespace" $root }}
  labels:
    {{- include "code-squad.agentLabels" $dctx | nindent 4 }}
  {{- with $root.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Only darryl (Kubernetes read access) and pam (sandbox pod management) need an API token.
automountServiceAccountToken: {{ has $id (list "darryl" "pam") }}
{{- end }}
{{- end }}
{{- end }}
