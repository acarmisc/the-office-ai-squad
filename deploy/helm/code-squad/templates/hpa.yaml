{{- $root := . -}}
{{- if .Values.hpa.enabled }}
{{- range $id := splitList " " (include "code-squad.agentIds" .) }}
{{- if (index $root.Values.agents $id).enabled }}
{{- $dctx := dict "id" $id "root" $root }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "code-squad.agentName" $dctx }}
  namespace: {{ include "code-squad.namespace" $root }}
  labels:
    {{- include "code-squad.agentLabels" $dctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "code-squad.agentName" $dctx }}
  minReplicas: {{ $root.Values.hpa.minReplicas }}
  maxReplicas: {{ $root.Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- end }}
