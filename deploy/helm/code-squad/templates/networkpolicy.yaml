{{- /*
Default-deny NetworkPolicies, one per enabled agent, plus one for the sandbox namespace.
Ingress: michael accepts the ingress controller (when ingress is on); specialists accept michael.
Both accept Prometheus scrapes. Egress: DNS, then only the CIDR groups filled in under networkPolicy.
Note: an empty CIDR group renders nothing, so the agent gets no route for that destination.
*/ -}}
{{- $root := . -}}
{{- $ns := include "code-squad.namespace" . -}}
{{- $np := .Values.networkPolicy -}}
{{- if $np.enabled }}
{{- range $id := splitList " " (include "code-squad.agentIds" .) }}
{{- if (index $root.Values.agents $id).enabled }}
{{- $dctx := dict "id" $id "root" $root }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "code-squad.agentName" $dctx }}
  namespace: {{ $ns }}
  labels:
    {{- include "code-squad.agentLabels" $dctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "code-squad.agentSelectorLabels" $dctx | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if eq $id "michael" }}
    {{- if and $root.Values.ingress.enabled $np.ingressControllerNamespaceSelector }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.ingressControllerNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- else }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: code-squad
              app.kubernetes.io/instance: {{ $root.Release.Name }}
              app.kubernetes.io/component: michael
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- with $np.prometheusNamespaceSelector }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $np.dnsPodSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if $np.llmGatewayCIDRs }}
    # LLM gateway
    {{- include "code-squad.egressCIDRRule" (dict "cidrs" $np.llmGatewayCIDRs "ports" $np.httpsPorts) | nindent 4 }}
    {{- end }}
    {{- if $np.vcsCIDRs }}
    # VCS host
    {{- include "code-squad.egressCIDRRule" (dict "cidrs" $np.vcsCIDRs "ports" $np.httpsPorts) | nindent 4 }}
    {{- end }}
    {{- if $np.otlpCIDRs }}
    # OTLP collector
    {{- include "code-squad.egressCIDRRule" (dict "cidrs" $np.otlpCIDRs "ports" $np.otlpPorts) | nindent 4 }}
    {{- end }}
    {{- if and $root.Values.egressProxy.url $np.egressProxyCIDRs }}
    # Egress proxy
    {{- include "code-squad.egressCIDRRule" (dict "cidrs" $np.egressProxyCIDRs "ports" $np.egressProxyPorts) | nindent 4 }}
    {{- end }}
    {{- if and $root.Values.sessionStore.url $np.sessionStoreCIDRs }}
    # Session store
    {{- include "code-squad.egressCIDRRule" (dict "cidrs" $np.sessionStoreCIDRs "ports" $np.sessionStorePorts) | nindent 4 }}
    {{- end }}
    {{- if eq $id "dwight" }}
    {{- if $np.advisoryCIDRs }}
    # Vulnerability intelligence (OSV, NVD, GHSA, KEV, EPSS): CIDRs must be kept current, see values.yaml
    {{- include "code-squad.egressCIDRRule" (dict "cidrs" $np.advisoryCIDRs "ports" $np.httpsPorts) | nindent 4 }}
    {{- end }}
    {{- end }}
    {{- if eq $id "michael" }}
    # Specialists (same namespace, HTTP on 8080)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: code-squad
              app.kubernetes.io/instance: {{ $root.Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["jim", "angela", "dwight", "darryl", "pam"]
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if or (eq $id "darryl") (eq $id "pam") }}
    {{- if $np.kubeAPIServerCIDRs }}
    # kube-apiserver
    {{- include "code-squad.egressCIDRRule" (dict "cidrs" $np.kubeAPIServerCIDRs "ports" $np.kubeAPIServerPorts) | nindent 4 }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $np.enabled .Values.sandbox.enabled (index .Values.agents "pam").enabled }}
---
# Sandbox namespace: pods accept no inbound traffic (exec and logs go through the API server),
# and may egress only to DNS and the allow-listed git or package hosts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: code-squad-sandbox
  namespace: {{ .Values.sandbox.namespace | quote }}
  labels:
    {{- include "code-squad.labels" $root | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $np.dnsPodSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.sandbox.allowedEgressCIDRs }}
    {{- include "code-squad.egressCIDRRule" (dict "cidrs" .Values.sandbox.allowedEgressCIDRs "ports" .Values.sandbox.allowedEgressPorts) | nindent 4 }}
    {{- end }}
{{- end }}
