# Offline LLM stub for the kind demo: the same image, started as `python -m deploy.fake_llm`,
# listening on port 4000. Applied by kind-up.sh into the code-squad namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-llm
  labels:
    app.kubernetes.io/name: fake-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-llm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fake-llm
          image: code-squad:dev
          imagePullPolicy: Never
          command: ["python", "-m", "deploy.fake_llm"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fake-llm
  labels:
    app.kubernetes.io/name: fake-llm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fake-llm
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
