# yaml-language-server: $schema=https://gitlab.com/gitlab-org/gitlab/-/raw/master/app/assets/javascripts/editor/schema/ci.json
# Calls michael for every merge request pipeline. Copy the job into the consuming project's
# .gitlab-ci.yml, or include this file from it.
#
# Project CI/CD variables:
#   SQUAD_URL          base URL of michael, for example https://squad.example.com (required)
#   SQUAD_POST         "true" lets michael publish its review. Any other value, or no value,
#                      runs a dry run: the review is computed and returned, nothing is posted.
#   SQUAD_FAIL_ON_BLOCK  "true" fails this job when the verdict is request_changes.
#
# The project must have a registry entry in the squad's projects.yaml, keyed by the project
# path (CI_PROJECT_PATH). The job uses no token: the squad authenticates to GitLab itself.
# Anything reachable at SQUAD_URL can start a review, so expose /invocations only on a
# network that the runners can reach (see the deployment security notes). When the squad
# requires the shared token (api.tokenSecret in the chart), store it as a masked variable
# SQUAD_API_TOKEN; the job sends it as a bearer token and sends an empty one when it is unset.

squad-review:
  stage: test
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    SQUAD_POST: "false"
    SQUAD_FAIL_ON_BLOCK: "false"
  timeout: 45 minutes
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      post=false
      if [ "${SQUAD_POST}" = "true" ]; then post=true; fi
      body=$(jq -n \
        --arg prompt "Review change request ${CI_MERGE_REQUEST_IID} in project ${CI_PROJECT_PATH}." \
        --arg project "${CI_PROJECT_PATH}" \
        --arg target "${CI_MERGE_REQUEST_IID}" \
        --argjson post "${post}" \
        '{prompt: $prompt, project: $project, target: $target, mode: "review", post: $post}')
    - |
      curl --silent --show-error --fail-with-body --max-time 2400 \
        -X POST "${SQUAD_URL}/invocations" \
        -H 'content-type: application/json' \
        -H "authorization: Bearer ${SQUAD_API_TOKEN:-}" \
        --data "${body}" \
        -o squad-result.json
    - jq '{agent, status, verdict, summary, warnings}' squad-result.json
    - |
      if [ "${SQUAD_FAIL_ON_BLOCK}" = "true" ] && [ "$(jq -r '.verdict' squad-result.json)" = "request_changes" ]; then
        echo "code-squad requested changes"
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - squad-result.json
