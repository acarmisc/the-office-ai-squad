plugins {
    id 'java'
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-web:3.2.0")
    implementation 'com.google.guava:guava:32.1.3-jre'
    api("org.apache.commons:commons-lang3:3.+")
    testImplementation "junit:junit:4.13.2"
    // implementation("commented.out:not-a-dependency:1.0")
    implementation platform("com.fasterxml.jackson:jackson-bom:2.15.3")
    implementation("com.fasterxml.jackson.core:jackson-databind")
    runtimeOnly("org.postgresql:postgresql:latest.release")
}
